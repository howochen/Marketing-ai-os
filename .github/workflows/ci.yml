name: Threads local setup offline checks
on: [push, pull_request]
env:
  MOS_THREADS_HTTP_ENABLED: "false"
  MOS_THREADS_PUBLISH_ENABLED: "false"
  MOS_THREADS_MAINTENANCE_ENABLED: "false"
  MOS_PHONE_SETUP_ENABLED: "false"
  MOS_AUTOMATION_ENABLED: "false"
  MOS_AUTOMATION_LIVE_ENABLED: "false"
  MOS_MODEL_CALLS_ENABLED: "false"
  MOS_SINGLE_AI_TEST_ENABLED: "false"
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_threads_setup.py
      - run: python -m pytest -q tests/test_threads_setup_order.py
      - run: python -m pytest -q tests/test_phone_setup.py
      - run: python -m pytest -q tests/test_content_workbench.py
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests migrations scripts
      - run: node --check app/web/automation.js
      - run: node --check app/web/brand-quick.js
      - run: node --test tests/brand_quick.test.cjs
      - run: mypy
      - run: git diff --check
      - run: git show --format= --check HEAD
      - run: pytest -q
      - run: pip-audit -r requirements-dev.txt
  postgres:
    runs-on: ubuntu-latest
    env:
      MOS_ADMIN_KEY: ci-only-admin-secret-at-least-thirty-characters
      POSTGRES_PASSWORD: ci-only-postgres
      MOS_APP_PASSWORD: ci-only-app
      MOS_MIGRATION_PASSWORD: ci-only-migrator
    steps:
      - uses: actions/checkout@v4
      - name: Test with a non-owner, non-superuser runtime role
        run: docker compose -p mos-p05-test --profile test run --build --rm tests
      - name: Synthetic backup and independent restore drill
        run: python scripts/backup_drill.py
      - if: always()
        run: docker compose -p mos-p05-test logs db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p05-backup-evidence
          path: docs/p05/backup-restore.json
