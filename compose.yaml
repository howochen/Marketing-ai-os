services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mos
      POSTGRES_USER: mos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mos -d mos"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MOS_ADMIN_KEY: ${MOS_ADMIN_KEY:?Set MOS_ADMIN_KEY in .env}
      DATABASE_URL: postgresql+psycopg://mos:${POSTGRES_PASSWORD}@db:5432/mos
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
