services:
  db:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: mos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MOS_APP_PASSWORD: ${MOS_APP_PASSWORD:?Set MOS_APP_PASSWORD}
      MOS_MIGRATION_PASSWORD: ${MOS_MIGRATION_PASSWORD:?Set MOS_MIGRATION_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mos"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://mos_migrator:${MOS_MIGRATION_PASSWORD}@db:5432/mos
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MOS_ADMIN_KEY: ${MOS_ADMIN_KEY:?Set MOS_ADMIN_KEY}
      DATABASE_URL: postgresql+psycopg://mos_app:${MOS_APP_PASSWORD}@db:5432/mos
      MOS_MODEL_CALLS_ENABLED: "false"
      MOS_PHONE_SETUP_ENABLED: "false"
      MOS_AUTOMATION_ENABLED: ${MOS_AUTOMATION_ENABLED:-false}
      MOS_PHONE_SETUP_AUTHORITY: ${MOS_PHONE_SETUP_AUTHORITY:-}
      MOS_THREADS_MAINTENANCE_ENABLED: ${MOS_THREADS_MAINTENANCE_ENABLED:-false}
      MOS_THREADS_HTTP_ENABLED: ${MOS_THREADS_HTTP_ENABLED:-false}
      MOS_THREADS_PUBLISH_ENABLED: ${MOS_THREADS_PUBLISH_ENABLED:-false}
      MOS_THREADS_APP_ID: ${MOS_THREADS_APP_ID:-}
      MOS_THREADS_APP_SECRET: ${MOS_THREADS_APP_SECRET:-}
      MOS_THREADS_REDIRECT_URI: ${MOS_THREADS_REDIRECT_URI:-}
      MOS_THREADS_TOKEN_KEY: ${MOS_THREADS_TOKEN_KEY:-}
      MOS_ENV: ${MOS_ENV:-development}
      MOS_PUBLIC_URL: ${MOS_PUBLIC_URL:-}
      MOS_TRUSTED_PROXIES: ${MOS_TRUSTED_PROXIES:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  recovery:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped
    environment:
      MOS_API_URL: ${MOS_RECOVERY_API_URL:-http://api:8000}
      MOS_WORKER_TOKEN: ${MOS_WORKER_TOKEN:-}
      MOS_RECOVERY_SECONDS: "60"
      MOS_THREADS_MAINTENANCE_ENABLED: ${MOS_THREADS_MAINTENANCE_ENABLED:-false}
    depends_on:
      api:
        condition: service_started
    profiles: [recovery]
  tests:
    build:
      context: .
      target: tests
    environment:
      DATABASE_URL: postgresql+psycopg://mos_app:${MOS_APP_PASSWORD}@db:5432/mos
      MIGRATION_DATABASE_URL: postgresql+psycopg://mos_migrator:${MOS_MIGRATION_PASSWORD}@db:5432/mos
    depends_on:
      db:
        condition: service_healthy
    profiles: [test]
  automation:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "app.automation_worker"]
    restart: unless-stopped
    profiles: [automation]
    environment:
      DATABASE_URL: postgresql+psycopg://mos_app:${MOS_APP_PASSWORD}@db:5432/mos
      MOS_AUTOMATION_ENABLED: ${MOS_AUTOMATION_ENABLED:-false}
      MOS_AUTOMATION_TENANT_ID: ${MOS_AUTOMATION_TENANT_ID:-}
      MOS_ENV: ${MOS_ENV:-development}
      MOS_THREADS_TOKEN_KEY: ${MOS_THREADS_TOKEN_KEY:-}
      MOS_THREADS_APP_ID: ${MOS_THREADS_APP_ID:-}
      MOS_THREADS_APP_SECRET: ${MOS_THREADS_APP_SECRET:-}
      MOS_MODEL_CALLS_ENABLED: "false"
      MOS_THREADS_HTTP_ENABLED: "false"
      MOS_THREADS_PUBLISH_ENABLED: "false"
      MOS_PHONE_SETUP_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
